<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340" role="img" aria-labelledby="title desc">
  <title id="title">هوم اسکرین پیشنهادی وتو اپ</title>
  <desc id="desc">طرح راست‌به‌چپ هوم اسکرین وتو اپ با تم سرمه‌ای، فیروزه‌ای، سبز و طلایی.</desc>

  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A237E"/>
      <stop offset="1" stop-color="#1A237E"/>
    </linearGradient>
    <linearGradient id="participation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A237E"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263238" flood-opacity=".16"/>
    </filter>
    <filter id="whiteShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#263238" flood-opacity=".25"/>
    </filter>
    <style>
      .fa { font-family: "B Mitra", "BMitra", "Noto Naskh Arabic", serif; }
      .navy { fill: #1A237E; }
      .muted { fill: #546E7A; }
      .white { fill: #fff; }
    </style>
  </defs>

  <!-- Page -->
  <rect width="1080" height="2340" fill="#F5F7FA"/>

  <!-- Header -->
  <path d="M0 0 H1080 V500 Q1080 550 1025 570 H55 Q0 550 0 500Z" fill="url(#header)"/>
  <circle cx="922" cy="88" r="38" fill="#fff" fill-opacity=".16"/>
  <path d="M922 65a23 23 0 0 1 23 23v16h-46V88a23 23 0 0 1 23-23Z" fill="none" stroke="#fff" stroke-width="5"/>
  <path d="M897 104h50" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Simplified VetoApp logo -->
  <g transform="translate(85 48)">
    <rect width="116" height="116" rx="35" fill="#202537"/>
    <path d="M21 28 L49 80 L78 14 H94 L60 91 H44 L14 42Z" fill="#00A53A"/>
    <path d="M36 52 L50 78 L44 91 L29 65Z" fill="#fff"/>
    <rect x="25" y="77" width="29" height="24" fill="none" stroke="#00B548" stroke-width="3"/>
    <text x="55" y="67" class="fa" font-size="31" font-weight="700" fill="#06AD3D">Veto</text>
    <text x="62" y="97" class="fa" font-size="28" font-weight="700" fill="#FF1641">app</text>
  </g>

  <text x="950" y="205" text-anchor="end" class="fa white" font-size="58" font-weight="700">سلام صادق</text>
  <text x="950" y="260" text-anchor="end" class="fa white" font-size="31" fill-opacity=".84">صدای شما، تصمیم بهتر برای ایران</text>

  <!-- Participation card -->
  <g filter="url(#whiteShadow)">
    <rect x="45" y="350" width="990" height="250" rx="38" fill="#fff"/>
  </g>
  <text x="965" y="410" text-anchor="end" class="fa navy" font-size="35" font-weight="700">مشارکت شما</text>
  <text x="965" y="462" text-anchor="end" class="fa muted" font-size="27">فعالیت مدنی شما در وتو اپ</text>
  <circle cx="195" cy="476" r="76" fill="none" stroke="#CFD8DC" stroke-width="16"/>
  <path d="M195 400 A76 76 0 1 1 135 522" fill="none" stroke="#2E7D32" stroke-width="16" stroke-linecap="round"/>
  <text x="195" y="490" text-anchor="middle" class="fa navy" font-size="40" font-weight="700">۶۸٪</text>
  <text x="195" y="532" text-anchor="middle" class="fa muted" font-size="23">امتیاز مشارکت</text>
  <line x1="365" y1="415" x2="365" y2="548" stroke="#CFD8DC" stroke-width="2"/>
  <text x="450" y="455" class="fa navy" font-size="32" font-weight="700">۱۲</text>
  <text x="450" y="495" class="fa muted" font-size="25">رأی ثبت‌شده</text>
  <text x="690" y="455" class="fa navy" font-size="32" font-weight="700">۴</text>
  <text x="690" y="495" class="fa muted" font-size="25">موضوع پیشنهادی</text>
  <text x="450" y="545" class="fa navy" font-size="32" font-weight="700">۳</text>
  <text x="450" y="580" class="fa muted" font-size="25">حوزه کاربری</text>
  <text x="690" y="545" class="fa navy" font-size="32" font-weight="700">۲</text>
  <text x="690" y="580" class="fa muted" font-size="25">فعالیت امروز</text>

  <!-- Section heading -->
  <text x="970" y="690" text-anchor="end" class="fa navy" font-size="42" font-weight="700">چه کاری می‌خواهید انجام دهید؟</text>
  <text x="970" y="733" text-anchor="end" class="fa muted" font-size="27">انتخاب کنید و در تصمیم‌سازی عمومی مشارکت داشته باشید</text>

  <!-- Main action cards -->
  <g filter="url(#shadow)">
    <rect x="45" y="785" width="470" height="265" rx="34" fill="#fff"/>
    <rect x="565" y="785" width="470" height="265" rx="34" fill="#fff"/>
    <rect x="45" y="1080" width="470" height="265" rx="34" fill="#fff"/>
    <rect x="565" y="1080" width="470" height="265" rx="34" fill="#fff"/>
  </g>

  <!-- Card accents -->
  <rect x="45" y="785" width="470" height="14" rx="7" fill="#1A237E"/>
  <rect x="565" y="785" width="470" height="14" rx="7" fill="#C62828"/>
  <rect x="45" y="1080" width="470" height="14" rx="7" fill="#2E7D32"/>
  <rect x="565" y="1080" width="470" height="14" rx="7" fill="#1A237E"/>

  <!-- Ballot icon -->
  <g transform="translate(225 835)">
    <rect x="0" y="26" width="110" height="92" rx="13" fill="#E8EAF6" stroke="#1A237E" stroke-width="7"/>
    <path d="M16 26 h78 l-18 -25 h-78z" fill="#1A237E"/>
    <path d="M33 3 L75 65" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M75 3 L33 65" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="280" y="988" text-anchor="middle" class="fa navy" font-size="40" font-weight="700">رأی‌گیری‌ها</text>
  <text x="280" y="1025" text-anchor="middle" class="fa muted" font-size="25">در رأی‌گیری‌های فعال شرکت کنید</text>

  <!-- Referendum icon -->
  <g transform="translate(745 830)">
    <circle cx="55" cy="62" r="58" fill="#FFEBEE" stroke="#C62828" stroke-width="7"/>
    <path d="M25 64 l22 22 l42 -48" fill="none" stroke="#C62828" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="988" text-anchor="middle" class="fa navy" font-size="40" font-weight="700">همه‌پرسی‌ها</text>
  <text x="800" y="1025" text-anchor="middle" class="fa muted" font-size="25">نظر جمعی مردم را ببینید</text>

  <!-- Impeachment icon -->
  <g transform="translate(225 1130)">
    <path d="M55 4 L108 30 V65 C108 102 83 125 55 137 C27 125 2 102 2 65 V30Z" fill="#E8F5E9" stroke="#2E7D32" stroke-width="7"/>
    <path d="M55 31 v53 M29 57 h52" stroke="#2E7D32" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="280" y="1283" text-anchor="middle" class="fa navy" font-size="40" font-weight="700">استیضاح</text>
  <text x="280" y="1320" text-anchor="middle" class="fa muted" font-size="25">فرایندهای نظارت عمومی</text>

  <!-- Suggestion icon -->
  <g transform="translate(745 1132)">
    <path d="M8 75 h100" stroke="#1A237E" stroke-width="8" stroke-linecap="round"/>
    <path d="M28 75 V30 h60 v45 M40 30 V14 h36 v16" fill="none" stroke="#1A237E" stroke-width="7" stroke-linejoin="round"/>
    <path d="M48 91 l20 20 l38 -43" fill="none" stroke="#1A237E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="1283" text-anchor="middle" class="fa navy" font-size="40" font-weight="700">پیشنهاد موضوع</text>
  <text x="800" y="1320" text-anchor="middle" class="fa muted" font-size="25">موضوع خود را با مردم مطرح کنید</text>

  <!-- Active list -->
  <text x="970" y="1465" text-anchor="end" class="fa navy" font-size="42" font-weight="700">موضوعات فعال</text>
  <text x="970" y="1505" text-anchor="end" class="fa muted" font-size="26">آخرین فرصت‌های مشارکت شما</text>
  <g filter="url(#shadow)">
    <rect x="45" y="1550" width="990" height="112" rx="28" fill="#fff"/>
    <rect x="45" y="1680" width="990" height="112" rx="28" fill="#fff"/>
  </g>
  <circle cx="965" cy="1606" r="12" fill="#2E7D32"/>
  <text x="925" y="1617" text-anchor="end" class="fa navy" font-size="30" font-weight="700">ساماندهی خدمات عمومی</text>
  <text x="120" y="1617" class="fa muted" font-size="25">۲ روز باقی‌مانده</text>
  <path d="M975 1736 h-32 M975 1736 l-16 -16 M975 1736 l-16 16" fill="none" stroke="#1A237E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="965" cy="1736" r="12" fill="#C62828"/>
  <text x="925" y="1747" text-anchor="end" class="fa navy" font-size="30" font-weight="700">شفافیت در تصمیم‌های عمومی</text>
  <text x="120" y="1747" class="fa muted" font-size="25">۵ روز باقی‌مانده</text>
  <path d="M975 1736 h-32 M975 1736 l-16 -16 M975 1736 l-16 16" fill="none" stroke="#1A237E" stroke-width="5" stroke-linecap="round"/>

  <!-- Call to action -->
  <g filter="url(#shadow)">
    <rect x="45" y="1840" width="990" height="155" rx="34" fill="#1A237E"/>
  </g>
  <text x="965" y="1900" text-anchor="end" class="fa white" font-size="37" font-weight="700">صدای شما مهم است</text>
  <text x="965" y="1944" text-anchor="end" class="fa white" font-size="27" fill-opacity=".78">با مشارکت آگاهانه، آینده را بهتر می‌سازیم</text>
  <rect x="90" y="1881" width="225" height="70" rx="35" fill="#C62828"/>
  <text x="202" y="1928" text-anchor="middle" class="fa navy" font-size="30" font-weight="700">مشاهده راهنما</text>

  <!-- RTL bottom navigation: home is rightmost -->
  <g filter="url(#whiteShadow)">
    <rect x="40" y="2155" width="1000" height="145" rx="70" fill="#fff"/>
  </g>
  <g transform="translate(915 2180)">
    <path d="M8 55 L58 8 L108 55 V108 H72 V78 H44 V108 H8Z" fill="#1A237E"/>
  </g>
  <text x="970" y="2295" text-anchor="middle" class="fa" font-size="37" font-weight="700" fill="#1A237E">خانه</text>

  <g transform="translate(675 2180)">
    <circle cx="48" cy="34" r="25" fill="#1A237E"/>
    <path d="M7 105 c4 -34 23 -50 41 -50 s37 16 41 50" fill="#1A237E"/>
    <circle cx="90" cy="77" r="23" fill="#1A237E"/>
    <path d="M90 65 v24 M78 77 h24" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="770" y="2295" text-anchor="middle" class="fa navy" font-size="37" font-weight="700">مشارکت</text>

  <g transform="translate(440 2180)" fill="none" stroke="#1A237E" stroke-width="6" stroke-linejoin="round">
    <path d="M10 5 h55 l22 22 v72 h-77z"/>
    <path d="M65 5 v24 h22 M25 48 h40 M25 66 h28"/>
    <circle cx="68" cy="83" r="22" fill="#fff"/>
    <path d="M68 69 v15 l10 7"/>
  </g>
  <text x="515" y="2295" text-anchor="middle" class="fa navy" font-size="37" font-weight="700">صندوق</text>

  <g transform="translate(135 2180)">
    <circle cx="48" cy="48" r="44" fill="#1A237E"/>
    <path d="M24 32 h48 M24 48 h48 M24 64 h48" stroke="#fff" stroke-width="6"/>
    <circle cx="14" cy="32" r="4" fill="#fff"/><circle cx="14" cy="48" r="4" fill="#fff"/><circle cx="14" cy="64" r="4" fill="#fff"/>
  </g>
  <text x="183" y="2295" text-anchor="middle" class="fa navy" font-size="37" font-weight="700">کاربری</text>
</svg>
