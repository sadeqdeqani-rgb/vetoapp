<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">لوگوی بازطراحی‌شده وتو اپ</title>
  <desc id="desc">نسخهٔ هماهنگ‌شدهٔ لوگوی وتو اپ با سرمه‌ای، سبز زمردی، قرمز وتو و سفید.</desc>
  <defs>
    <style>
      .brand { font-family: "Arial Rounded MT Bold", "DejaVu Sans", sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Deep Navy brand field -->
  <rect x="40" y="40" width="1520" height="1520" rx="430" fill="#1A237E"/>

  <!-- Voting mark / V -->
  <path d="M275 365
           C365 365 430 395 475 465
           L610 700
           L825 245
           C847 199 885 170 935 170
           L1002 170
           L735 720
           C710 770 671 799 625 799
           C584 799 549 775 525 735
           L360 453
           L405 580
           L492 740
           L432 778
           C390 798 350 778 328 738
           Z"
        fill="#2E7D32" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>

  <!-- Hand -->
  <path d="M470 642
           C500 663 528 679 556 691
           C598 710 629 744 638 789
           L651 875
           C658 925 635 960 602 982
           C574 1001 543 997 520 973
           L476 928
           C452 904 432 873 421 834
           L392 732
           C381 690 415 655 470 642 Z"
        fill="#FFFFFF" stroke="#263238" stroke-width="8"/>
  <path d="M520 757 C553 747 582 763 599 789
           C612 810 622 834 628 861
           L638 902
           C643 928 625 949 603 956
           C579 963 559 948 548 926
           L514 858
           C499 826 492 780 520 757 Z"
        fill="#263238"/>

  <!-- Red ballot -->
  <rect x="407" y="867" width="220" height="175" rx="14" fill="#C62828" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M422 878 H612 V905 H422 Z" fill="#A51F25"/>

  <!-- Ballot box -->
  <path d="M288 1037 H745 L795 1105 V1285 H238 V1105 Z"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  <path d="M288 1037 H745 L795 1105 H238 Z"
        fill="#2E7D32" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  <path d="M252 1112 H780 V1269 H252 Z" fill="#1A237E" stroke="#2E7D32" stroke-width="14"/>
  <rect x="374" y="1140" width="284" height="100" fill="#2E7D32"/>
  <path d="M335 1074 H707" stroke="#2E7D32" stroke-width="10"/>

  <!-- Veto -->
  <text x="770" y="760" class="brand" font-size="270" fill="#2E7D32" stroke="#FFFFFF" stroke-width="8" paint-order="stroke">Veto</text>

  <!-- app -->
  <text x="790" y="1158" class="brand" font-size="255" fill="#C62828" stroke="#FFFFFF" stroke-width="8" paint-order="stroke">app</text>
</svg>
